# Netlify configuration — Casa Kayam (static site)
# Le site est purement statique : aucune étape de build, on publie le dossier dist tel quel.

[build]
  publish = "site-casa-kayam/dist"
  command = ""

# En-têtes de cache : les assets (images, css, js) ne changent jamais sous le même nom,
# on les met en cache long. Les pages HTML restent fraîches.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
